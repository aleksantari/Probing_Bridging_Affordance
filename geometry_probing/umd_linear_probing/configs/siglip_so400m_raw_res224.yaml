dataset:
  root: ../../datasets/UMD/part-affordance-dataset
  split_path: metadata/splits/category_split_seed42_v20.json
  patch_size: 14
  num_classes: 8
  ignore_index: 255
  min_patch_coverage: 0.55
  exclude_background: false
  metric_ignore_indices: [0]
  image_size: [224, 224]
  pad_to_patch_multiple: false
  geometry:
    use_depth: false
    use_normal: false

model:
  target: siglip_so400m
  params:
    source: raw
    model_id: google/siglip-so400m-patch14-384
    precision: bf16
    patch_size: 14
    layers_to_hook: [6, 13, 20, 26]
    head:
      type: multi_layer_linear
      feature_keys: [6, 13, 20, 26]
      primary_key: 6
      fuse_mode: concat
      use_batchnorm: true
      dropout: 0.0
    output_dir_name: siglip_so400m_raw_res224

training:
  batch_size: 4
  num_workers: 4
  max_epochs: 2
  patience: 1
  lr_grid: [0.001]
  weight_decay_grid: [0.01]
  grad_clip_norm: 1.0
  eval_interval: 1
  log_interval: 100
  val_log_interval: 100
  device: cuda
  precision: bf16
  output_root: outputs
  seed: 1337
  accumulate_grad_batches: 1
